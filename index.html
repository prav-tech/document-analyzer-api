<!DOCTYPE html>
<html>
<head>
    <title>Document Analyzer</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            padding: 40px;
            background: #f5f5f5;
        }
        .box {
            background: white;
            padding: 20px;
            border-radius: 10px;
            width: 400px;
            margin: auto;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        button {
            padding: 10px;
            background: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
        }
        #result {
            margin-top: 20px;
            text-align: left;
        }
    </style>
</head>
<body>

<div class="box">
    <h2>📄 Document Analyzer</h2>

    <input type="file" id="fileInput"><br><br>

    <button onclick="uploadFile()">Analyze</button>

    <div id="result"></div>
</div>

<script>
async function uploadFile() {
    const file = document.getElementById("fileInput").files[0];
    if (!file) {
        alert("Please select a file");
        return;
    }

    const reader = new FileReader();

    reader.onload = async function() {
        const base64 = reader.result.split(",")[1];

        const response = await fetch("https://quickai-qy5b.onrender.com/api/document-analyze", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "x-api-key": "default_key"
            },
            body: JSON.stringify({
                fileName: file.name,
                fileType: file.name.split('.').pop(),
                fileBase64: base64
            })
        });

        const data = await response.json();

        document.getElementById("result").innerHTML = `
            <h3>Summary:</h3>
            <p>${data.summary}</p>
            <h3>Sentiment:</h3>
            <p>${data.sentiment}</p>
        `;
    };

    reader.readAsDataURL(file);
}
</script>

</body>
</html>
